name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go vet / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: Cross-compile (linux/amd64, linux/arm64, windows/amd64)
        run: |
          for t in linux/amd64 linux/arm64 windows/amd64; do
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build -trimpath -o /tmp/out/${t%/*}-${t#*/}/ ./cmd/...
          done

  publish-script:
    name: Publish-FileServer.ps1 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build server
        shell: pwsh
        run: go build -o bin/ ./cmd/server
      - name: Run publish script against a live server
        shell: pwsh
        run: ./tools/ci/Test-PublishScript.ps1

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t file-server:ci .
      - name: Start and check health
        run: |
          docker run -d --name fs -p 8080:8080 -e FS_ADMIN_PASSWORD=ci-password file-server:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' fs)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' fs | grep -qx healthy
          curl -fsS -H 'Content-Type: application/json' -d '{"username":"admin","password":"ci-password"}' localhost:8080/api/v1/auth/login
      - if: failure()
        run: docker logs fs || true
