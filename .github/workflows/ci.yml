name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go vet / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: Cross-compile (linux/amd64, linux/arm64, windows/amd64)
        run: |
          for t in linux/amd64 linux/arm64 windows/amd64; do
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build -trimpath -o /tmp/out/${t%/*}-${t#*/}/ ./cmd/...
          done

  publish-script:
    name: Publish-FileServer.ps1 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build server
        shell: pwsh
        run: go build -o bin/ ./cmd/server
      - name: Run publish script against a live server
        shell: pwsh
        run: ./tools/ci/Test-PublishScript.ps1

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t file-server:ci .
      - name: Start and check health
        run: |
          docker run -d --name fs -p 8080:8080 -e FS_ADMIN_PASSWORD=ci-password file-server:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' fs)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' fs | grep -qx healthy
          curl -fsS -H 'Content-Type: application/json' -d '{"username":"admin","password":"ci-password"}' localhost:8080/api/v1/auth/login
      - if: failure()
        run: docker logs fs || true

  deploy-image:
    name: Deploy-Image.ps1 (build -> save -> scp -> load over SSH)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Local SSH server standing in for the Docker host
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server
          sudo systemctl start ssh || sudo service ssh start
          mkdir -p ~/.ssh && ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
          ssh -o StrictHostKeyChecking=accept-new localhost true
      - name: First run copies files, creates .env and stops
        shell: pwsh
        run: |
          ./tools/docker/Deploy-Image.ps1 -Server "$env:USER@localhost" -RemoteDir '~/fs-deploy'
          if (-not (Test-Path ~/fs-deploy/.env)) { throw '.env was not created on the server' }
          (Get-Content ~/fs-deploy/.env) -replace '^FS_ADMIN_PASSWORD=.*', 'FS_ADMIN_PASSWORD=ci-password' | Set-Content ~/fs-deploy/.env
      - name: Second run loads the image and starts it
        shell: pwsh
        run: ./tools/docker/Deploy-Image.ps1 -Server "$env:USER@localhost" -RemoteDir '~/fs-deploy'
      - name: Server answers
        run: |
          curl -fsS localhost:8080/healthz
          curl -fsS -H 'Content-Type: application/json' -d '{"username":"admin","password":"ci-password"}' localhost:8080/api/v1/auth/login
      - name: Update keeps the previous image for rollback
        shell: pwsh
        run: |
          ./tools/docker/Deploy-Image.ps1 -Server "$env:USER@localhost" -RemoteDir '~/fs-deploy'
          docker image inspect file-server:before-update | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'file-server:before-update missing' }
          if (Test-Path ./file-server-image.tar) { throw 'local image file not cleaned up' }
      - if: failure()
        run: cd ~/fs-deploy && docker compose logs --tail 50 || true
